services:
  service:
    image: ${SERVICE_IMAGE:-aide-kit-service}
    ports:
      - "7080:7080"
    environment:
      APP_PROFILE: ${APP_PROFILE:-live}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OBSIDIAN_REPO_URL: ${OBSIDIAN_REPO_URL:-}
      OBSIDIAN_REPO_TOKEN: ${OBSIDIAN_REPO_TOKEN:-}
      OBSIDIAN_REPO_BRANCH: ${OBSIDIAN_REPO_BRANCH:-}
      OBSIDIAN_CLONE_DIR: ${OBSIDIAN_CLONE_DIR:-/data/vault-clone}
    volumes:
      - vault-clone:/data

  web:
    image: ${WEB_IMAGE:-aide-kit-web}
    ports:
      - "7081:80"
    depends_on:
      - service

volumes:
  vault-clone:
