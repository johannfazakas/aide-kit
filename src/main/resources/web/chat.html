<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>aide-kit chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(128, 128, 128, 0.3);
      font-weight: 600;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .msg { max-width: 75%; padding: 0.5rem 0.75rem; border-radius: 0.75rem; white-space: pre-wrap; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: rgba(128, 128, 128, 0.2); }
    .meta { align-self: center; font-size: 0.8rem; opacity: 0.7; }
    form { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; border-top: 1px solid rgba(128, 128, 128, 0.3); }
    #message { flex: 1; padding: 0.6rem 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(128, 128, 128, 0.5); font: inherit; }
    button { padding: 0.6rem 1rem; border-radius: 0.5rem; border: none; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>aide-kit assistant</header>
  <div id="log"></div>
  <form id="form">
    <input id="message" autocomplete="off" placeholder="Ask about your tasks…" autofocus />
    <button id="send" type="submit">Send</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");
    let sessionId = null;

    function add(text, cls) {
      const el = document.createElement("div");
      el.className = cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      add(message, "msg user");
      input.value = "";
      send.disabled = true;
      const pending = add("…", "msg assistant");
      try {
        const response = await fetch("/api/v1/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId }),
        });
        const body = await response.json();
        if (response.ok) {
          sessionId = body.sessionId;
          pending.textContent = body.reply;
        } else {
          pending.remove();
          add(body.message || `Error ${response.status}`, "meta");
        }
      } catch (err) {
        pending.remove();
        add("Network error: " + err.message, "meta");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
